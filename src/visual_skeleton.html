      meta[op.id] = { from: op.from, to: op.to, label: op.label };
      drawArrowGeometry(op.id);
      if (animate) { g.style.opacity = 0; await tween({ targets: g, opacity: [0, 1], duration: 500 }); }
      break; }
    case "packet": {
      if (!animate) break; // transient — nothing to replay
      const m = meta[op.along]; if (!m || !m.path) break;
      const g = el("g", {});
      g.classList.add("packet");
      const dot = rc.circle(0, 0, 16, roughOpts(op.along + ":packet",
        { stroke: "var(--accent)", fill: "var(--accent)", fillStyle: "solid", strokeWidth: 2 }));
      g.appendChild(dot);
      if (op.label) { const t = el("text", { x: 0, y: -14, class: "alabel" }); t.textContent = op.label; g.appendChild(t); }
      root.appendChild(g);
      const p = anime.path(m.path); // anime.js motion path — the reason the library is here
      await tween({ targets: g, translateX: p("x"), translateY: p("y"), duration: 1100, easing: "easeInOutSine" });
      g.remove(); break; }
    case "pulse": {
      if (!animate) break;
      const g = find(op.id); if (!g) break;
      await tween({ targets: g, opacity: [1, .35, 1], duration: 700, loop: 2 }); // opacity, not scale — avoids SVG <g> transform-origin quirks
      break; }
    case "highlight": {
      const g = find(op.id); if (!g) break;
      const on = op.on !== false;
      g.classList.toggle("hl", on);
      const prevHl = g.querySelector(".hl-rough");
      if (prevHl) prevHl.remove();
      if (on) {
        const m = meta[op.id]; if (!m) break;
        const pad = 6;
        const hlOpts = roughOpts(op.id + ":hl", { stroke: "var(--accent)", strokeWidth: 3 });
        let shape = null;
        if (m.kind === "circle") shape = rc.circle(m.ox, m.oy, (m.r + pad) * 2, hlOpts);
        else if (m.kind === "rect") shape = rc.rectangle(m.ox - pad, m.oy - pad, m.w + pad * 2, m.h + pad * 2, hlOpts);
        if (shape) { shape.classList.add("hl-rough"); g.appendChild(shape); }
      }
      break; }
    case "note": {
      const id = op.id || "note";
      // Same nudge treatment as `add`: predict from the op, resolve, use LOCAL nudged
      // coords — op.x/op.y themselves are never mutated, so replay recomputes identically.
      const predicted = aabbFromSpec(op);
      const { dx, dy } = resolveCollision(predicted);
      const nx = op.x + dx, ny = op.y + dy;
      if (dx || dy) console.debug("[nudge]", id, dx, dy);
      const g = el("g", { id: "el-" + id });
      g.classList.add("notebox");
      const w = Math.max(140, (op.text || "").length * 9.5 + 28), h = 42;
      const shape = rc.rectangle(nx - w / 2, ny - h / 2, w, h,
        roughOpts(id, { stroke: "var(--note-border)", fill: "var(--note-bg)", fillStyle: "solid", strokeWidth: 2 }));
      g.appendChild(shape);
      const t = el("text", { x: nx, y: ny, class: "lbl" });
      t.textContent = op.text || ""; g.appendChild(t);
      meta[id] = { cx: nx, cy: ny, kind: "rect", ox: nx - w / 2, oy: ny - h / 2, w, h };
      orig[id] = { cx: nx, cy: ny };
      root.appendChild(g);
      // Second correction pass, same rationale as `add`.
      const bb = g.getBBox();
      if (bb.width > 0 && bb.height > 0) {
        const predW = predicted.x2 - predicted.x1, predH = predicted.y2 - predicted.y1;
        if (bb.width > predW || bb.height > predH) {
          const real = { x1: bb.x, y1: bb.y, x2: bb.x + bb.width, y2: bb.y + bb.height };
          const r2 = resolveCollision(real, id);
          if (r2.dx || r2.dy) {
            anime.set(g, { translateX: r2.dx, translateY: r2.dy });
            meta[id].cx += r2.dx; meta[id].cy += r2.dy;
            console.debug("[nudge]", id, r2.dx, r2.dy);
          }
        }
      }
      if (animate) { g.style.opacity = 0; await tween({ targets: g, opacity: [0, 1], duration: 420 }); }
      break; }
  }
}

async function showScene(i, animate) {
  cur = i;
  cap.textContent = SCENES[i].caption || "";
  counter.textContent = (i + 1) + "/" + SCENES.length;
  syncDetail();
  for (const op of SCENES[i].ops || []) await apply(op, animate);
}

// Detail drawer (player chrome, not an op). detailOpen is a session preference:
// open by default, the notch toggle flips it and it STICKS across scene changes.
// The panel shows only when (detailOpen && active scene has a detail); scenes
// without detail dim the toggle and hide the panel, but don't reset the preference.
const detailBtn = document.getElementById("detail-btn");
const detailPanel = document.getElementById("detail-panel");
const detailCaption = document.getElementById("detail-caption");
const detailText = document.getElementById("detail-text");
let detailOpen = false; // closed by default — the notch ⓘ opens it (Anil's call)
function syncDetail() {
  const d = (cur >= 0 && SCENES[cur] && SCENES[cur].detail) || "";
  detailText.textContent = d;
  detailCaption.textContent = d ? (SCENES[cur].caption || "") : "";
  detailBtn.setAttribute("aria-disabled", String(!d));
  const visible = !!d && detailOpen;
  detailPanel.classList.toggle("open", visible);
  document.body.classList.toggle("panel-open", visible); // stage reflow: fit remaining width
  detailBtn.setAttribute("aria-expanded", String(visible));
}
detailBtn.onclick = () => {
  if (detailBtn.getAttribute("aria-disabled") === "true") return;
  detailOpen = !detailOpen;
  syncDetail();
};

async function renderUpTo(i) { // deterministic replay, instant
  anime.remove(root.querySelectorAll("*")); // kill in-flight tweens before rebuild
  root.innerHTML = "";
  for (const k in meta) delete meta[k];
  for (const k in orig) delete orig[k];
  for (let s = 0; s < i; s++) { cap.textContent = SCENES[s].caption;
    for (const op of SCENES[s].ops || []) await apply(op, false); }
  await showScene(i, true);
}

function stopPlay() { playing = false; playToken++; document.getElementById("play").textContent = "▶ play"; }

document.getElementById("next").onclick = async () => { stopPlay(); if (cur + 1 < SCENES.length) await showScene(cur + 1, true); };
document.getElementById("prev").onclick = async () => { stopPlay(); if (cur > 0) await renderUpTo(cur - 1); };
document.getElementById("play").onclick = async function () {
  if (playing) { stopPlay(); return; }
  playing = true; this.textContent = "❚❚ pause"; const my = ++playToken;
  if (cur + 1 >= SCENES.length) { await renderUpTo(0); await sleep(SCENES[0].duration || 3500); }
  while (playing && my === playToken && cur + 1 < SCENES.length) {
    await showScene(cur + 1, true);
    await sleep(SCENES[cur].duration || 3500);
  }
  if (my === playToken) stopPlay();
};

if (SCENES.length) showScene(0, true); else cap.textContent = "no scenes";
</script>
</html>
