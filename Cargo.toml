[package]
name = "usta"
version = "0.1.0"
edition = "2021"
description = "Terminal'de çalışan, Opus destekli Socratic öğrenim mentoru"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rustyline = "14"
anyhow = "1"
dirs = "5"
similar = "2"
chrono = "0.4"
termimad = "0.30"
ratatui = "0.29"
tui-input = "0.11"
ansi-to-tui = "7"
unicode-width = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
# coolor/crokey doğrudan kullanılmıyor — termimad'in transitive bağımlılığı.
# crossterm tekilliğini manifest seviyesinde koru: coolor 1.1+/crokey 1.5+ crossterm ^0.29'a geçiyor,
# bu da 0.28 + 0.29 ikili crossterm ağacına yol açar. Bare `cargo update` lockfile pinini yok sayabildiği
# için tavanı burada, manifest'te sabitliyoruz.
coolor = "=1.0.0"
crokey = "=1.1.1"
crokey-proc_macros = "=1.1.1"
