[package]
name = "usta"
version = "0.1.0"
edition = "2021"
description = "Terminal'de çalışan, Opus destekli Socratic öğrenim mentoru"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rustyline = "14"
anyhow = "1"
dirs = "5"
similar = "2"
chrono = "0.4"
termimad = "0.30"
ratatui = "0.29"
tui-input = "0.11"
ansi-to-tui = "7"
unicode-width = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
