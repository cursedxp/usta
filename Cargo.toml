[package]
name = "usta"
version = "0.1.0"
edition = "2021"
description = "Terminal'de çalışan, Opus destekli Socratic öğrenim mentoru"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rustyline = "14"
anyhow = "1"
